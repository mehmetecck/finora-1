<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finora — My Watchlist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/base.css" rel="stylesheet" />
  <link href="css/pages/market.css" rel="stylesheet" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <div class="eyebrow mb-1">Saved stocks</div>
        <h2 class="section-title mb-0">My Watchlist</h2>
      </div>
      <a href="market.html" class="btn btn-brand"><i class="bi bi-search me-1"></i>Browse market</a>
    </div>

    <div class="row g-4">
      <!-- ===================== Watchlist sidebar ==================== -->
      <div class="col-lg-3">
        <div class="card-finora p-3">
          <div class="text-muted-2 small fw-semibold text-uppercase mb-2" style="letter-spacing:.06em">Your watchlist</div>
          <div id="stockList" class="d-grid gap-1" style="max-height:70vh;overflow:auto"></div>
        </div>
      </div>

      <!-- ======================= Stock detail ====================== -->
      <div class="col-lg-9" id="stockDetail"><!-- filled by JS --></div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="js/core/firebase-config.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/core/main.js"></script>
  <script src="js/core/charts.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/pages/watchlist.js"></script>
</body>
</html>
