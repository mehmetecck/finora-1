<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finora — Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/base.css" rel="stylesheet" />
  <script src="js/core/auth-init.js"></script>
  <link href="css/pages/home.css" rel="stylesheet" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container py-4">
    <header class="dashboard-header mb-4">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
        <div>
          <div class="eyebrow mb-1">Overview</div>
          <h1 class="section-title mb-1 loading" id="dashGreeting">Welcome back</h1>
          <p class="text-muted-2 mb-0" id="dashSub">Your summary at a glance.</p>
        </div>
        <a href="market.html" class="btn btn-brand"><i class="bi bi-search me-1"></i>Explore market</a>
      </div>
    </header>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <a href="market.html" class="dash-quick-card">
          <span class="dash-quick-icon"><i class="bi bi-graph-up-arrow"></i></span>
          <span class="dash-quick-label">Market</span>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="portfolio.html" class="dash-quick-card">
          <span class="dash-quick-icon"><i class="bi bi-wallet2"></i></span>
          <span class="dash-quick-label">Portfolio</span>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="watchlist.html" class="dash-quick-card">
          <span class="dash-quick-icon"><i class="bi bi-star"></i></span>
          <span class="dash-quick-label">Watchlist</span>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="profile.html" class="dash-quick-card">
          <span class="dash-quick-icon"><i class="bi bi-person"></i></span>
          <span class="dash-quick-label">Profile</span>
        </a>
      </div>
    </div>

    <div class="row g-3 mb-4" id="dashStatsRow">
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card h-100">
          <div class="label mb-1"><i class="bi bi-wallet2 me-1"></i>Portfolio value</div>
          <div class="value" id="statPortfolio">—</div>
          <span class="text-muted-2 small" id="statPortfolioSub">Loading…</span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card h-100">
          <div class="label mb-1"><i class="bi bi-star me-1"></i>Watchlist</div>
          <div class="value" id="statWatchlist">0</div>
          <span class="text-muted-2 small">Saved symbols</span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card h-100">
          <div class="label mb-1"><i class="bi bi-bar-chart me-1"></i>Indices</div>
          <div class="value" id="statIndices">—</div>
          <span class="text-muted-2 small" id="statIndicesSub">Major markets</span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card h-100">
          <div class="label mb-1"><i class="bi bi-lightning-charge me-1"></i>Trending</div>
          <div class="value" id="statTrending">—</div>
          <span class="text-muted-2 small">Most active today</span>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-lg-7">
        <div class="card-finora p-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Market snapshot</h5>
            <a href="market.html" class="btn btn-sm btn-ghost">View all <i class="bi bi-arrow-right ms-1"></i></a>
          </div>
          <div id="dashTrending" class="d-grid gap-2"></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card-finora p-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Your watchlist</h5>
            <a href="watchlist.html" class="btn btn-sm btn-ghost">Open <i class="bi bi-arrow-right ms-1"></i></a>
          </div>
          <div id="dashWatchlist" class="d-grid gap-2"></div>
        </div>
      </div>
    </div>

    <div class="card-finora p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Major indices</h5>
        <a href="market.html" class="btn btn-sm btn-ghost">Market <i class="bi bi-arrow-right ms-1"></i></a>
      </div>
      <div class="row g-3" id="dashIndices"></div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="js/core/firebase-config.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/core/main.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/pages/home.js"></script>
</body>
</html>
