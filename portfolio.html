<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finora — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/base.css" rel="stylesheet" />
  <script src="js/core/auth-init.js"></script>
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container py-4">
    <!-- ============================ Header =========================== -->
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <div class="eyebrow mb-1">Your portfolio</div>
        <h2 class="section-title mb-0">Track your investments</h2>
      </div>
      <a href="market.html" class="btn btn-brand"><i class="bi bi-plus-lg me-1"></i>Buy stocks</a>
    </div>

    <!-- ========================= Summary cards ====================== -->
    <div class="row g-3 mb-4">
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card h-100">
          <div class="label mb-1"><i class="bi bi-wallet2 me-1"></i>Total value</div>
          <div class="value" id="totalValue">$0.00</div>
          <span class="badge badge-bull mt-1" id="totalReturnBadge"></span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card h-100">
          <div class="label mb-1"><i class="bi bi-graph-up me-1"></i>Today's P/L</div>
          <div class="value" id="todayPL">$0.00</div>
          <span class="badge badge-bull mt-1" id="todayPLBadge"></span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card h-100">
          <div class="label mb-1"><i class="bi bi-cash-coin me-1"></i>Buying power</div>
          <div class="value" id="buyingPower">$0.00</div>
          <span class="text-muted-2 small">Available to trade</span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card h-100">
          <div class="label mb-1"><i class="bi bi-collection me-1"></i>Invested</div>
          <div class="value" id="investedValue">$0.00</div>
          <span class="text-muted-2 small"><span id="holdingsCount">0</span> holdings</span>
        </div>
      </div>
    </div>

    <!-- ===================== Performance + Allocation =============== -->
    <div class="row g-4 mb-4">
      <div class="col-lg-8">
        <div class="card-finora p-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Performance</h5>
            <div class="btn-group btn-group-sm" id="rangeBtns">
              <button class="btn btn-ghost active" data-range="1W">1W</button>
              <button class="btn btn-ghost" data-range="1M">1M</button>
              <button class="btn btn-ghost" data-range="1Y">1Y</button>
            </div>
          </div>
          <div id="perfWrap"><canvas id="perfChart" height="240"></canvas></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card-finora p-4 h-100">
          <h5 class="fw-bold mb-3">Allocation</h5>
          <div id="allocWrap"><canvas id="allocChart" height="180"></canvas></div>
          <div id="allocLegend" class="mt-3 d-grid gap-2"></div>
        </div>
      </div>
    </div>

    <!-- =========================== Holdings ========================= -->
    <div class="card-finora mb-4">
      <div class="p-4 pb-0 d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0">Holdings</h5>
        <span class="text-muted-2 small">Live prices</span>
      </div>
      <div class="table-responsive">
        <table class="table table-finora">
          <thead>
            <tr>
              <th>Asset</th>
              <th class="text-end">Shares</th>
              <th class="text-end d-none d-md-table-cell">Avg cost</th>
              <th class="text-end">Price</th>
              <th class="text-end">Value</th>
              <th class="text-end">Total return</th>
              <th class="text-end">Trade</th>
            </tr>
          </thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- ========================= Transactions ======================= -->
    <div class="card-finora p-4">
      <h5 class="fw-bold mb-3">Recent transactions</h5>
      <div id="txList"></div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="js/core/firebase-config.js"></script>
  <script src="js/core/components.js"></script>
  <script src="js/core/main.js"></script>
  <script src="js/core/charts.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/pages/portfolio.js"></script>
</body>
</html>
